services:
  redis-stack:
    image: redis/redis-stack-server:7.4.0-v0
    container_name: gateway-redis-vector
    ports:
      - "6379:6379"
    environment:
      - REDIS_ARGS=--maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    deploy:
      resources:
        limits:
          memory: 256M
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gateway-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: gateway-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    deploy:
      resources:
        limits:
          memory: 256M