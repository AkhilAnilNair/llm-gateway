spring.application.name=llm-gateway
server.port=8080

# Gateway Node Configuration
gateway.nodes.local-url=http://localhost:11434/v1
gateway.nodes.cloud-url=https://api.groq.com/openai/v1
gateway.nodes.cloud-api-key=${GROQ_KEY}

# Actuator & Prometheus Exposure
management.endpoints.web.exposure.include=health,prometheus,metrics

# Micrometer Histograms ( Wrapped in [ ] so Spring Boot 3 preserves the dots in metric names )
management.metrics.distribution.percentiles-histogram.[llm.gateway.ttft]=true
management.metrics.distribution.percentiles-histogram.[llm.gateway.tpot]=true
management.metrics.distribution.percentiles-histogram.[llm.gateway.e2e.latency]=true

# Micrometer Percentiles (p50, p95, p99)
management.metrics.distribution.percentiles.[llm.gateway.ttft]=0.5,0.95,0.99
management.metrics.distribution.percentiles.[llm.gateway.tpot]=0.5,0.95,0.99
management.metrics.distribution.percentiles.[llm.gateway.e2e.latency]=0.5,0.95,0.99